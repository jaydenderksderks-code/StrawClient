[package]
name = "strawclient"
version = "0.1.0"
description = "A lightweight, CRT-inspired Minecraft Java launcher"
authors = ["Strawberry Linux contributors"]
edition = "2021"

[lib]
name = "strawclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
